async function fileToText(file){
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.txt') || file.type === 'text/plain') return await file.text();
  if (name.endsWith('.pdf') || file.type === 'application/pdf') {
    await loadScript(LIB.pdfWorker); await loadScript(LIB.pdf);
    const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
    const pdf = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    let out = '';
    for (let p = 1; p <= Math.min(pdf.numPages, 6); p++) {
      const page = await pdf.getPage(p); const tc = await page.getTextContent();
      let lastY = null, line = '';
      for (const it of tc.items) { const y = Math.round(it.transform[5]); if (lastY !== null && Math.abs(y - lastY) > 2) { out += line + '\n'; line = ''; } line += (line && !line.endsWith(' ') ? ' ' : '') + it.str; lastY = y; }
      out += line + '\n\n';
    }
    return out;
  }
  if (name.endsWith('.docx')) {
    await loadScript(LIB.mammoth);
    const res = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    return res.value;
  }
  throw new Error('type');
}

function tailorLocal(r, j){
  const t = S.t, kwAll = j.keywords.have.concat(j.keywords.related, confirmed());
  const hasKw = s => kwAll.some(k => s.toLowerCase().includes(k.toLowerCase().split(' ')[0]));
  let stretch = 0, bid = 0;
  const experience = r.experience.map((e, ei) => ({company:e.company, role:e.role, dates:e.dates, bullets: e.bullets.map((b, bi) => {
    const id = 'b' + (bid++);
    const editable = t.sections.exp && (t.expMode === 'full' || ei === 0);
    if (!editable) return {id, text:b, status:'unchanged', original:b};
    for (const [re, rep, kind] of UPGRADES) if (re.test(b)) {
      if (kind === 'stretch' && stretch >= 2) break;
      if (kind === 'stretch') stretch++;
      const text = b.replace(re, rep).replace(/\s{2,}/g, ' ');
      return {id, text, status:kind, original:b, note: kind === 'stretch' ? `Your resume says “${b.split(' ').slice(0, 4).join(' ')}…”, which describes a supporting role.` : ''};
    }
    return {id, text:b, status: hasKw(b) ? 'keyword' : 'unchanged', original:b};
  })}));
  const topHave = j.keywords.have.slice(0, 3);
  const summary = t.sections.summary
    ? `${r.headline} with ${r.years}+ years of experience in ${r.industries.slice(0, 2).join(' and ')}${topHave.length ? `, bringing ${topHave.join(', ')}` : ''}${j.keywords.related.length ? ` and hands-on ${j.keywords.related.join(' and ')} experience` : ''} to a ${j.title} role.${confirmed().length ? ` Skilled in ${confirmed().join(', ')}.` : ''}`
    : r.summary;
  const skills = t.sections.skills
    ? uniq(confirmed()).map(s => ({text:s, status:'added'})).concat(j.keywords.related.map(s => ({text:s, status:'keyword'})), j.keywords.have.filter(k => !r.skills.some(s => s.toLowerCase() === k.toLowerCase())).map(s => ({text:s, status:'keyword'})), r.skills.map(s => ({text:s, status: j.keywords.have.some(k => k.toLowerCase() === s.toLowerCase()) ? 'keyword' : 'kept'})))
    : r.skills.map(s => ({text:s, status:'kept'}));

    changes: [t.sections.summary && 'Summary rewritten for this role', t.sections.skills && `${j.keywords.related.length + confirmed().length} job keywords added or highlighted`, improved && `${improved} experience bullets strengthened`, 'ATS-friendly formatting kept'].filter(Boolean),
    scoreAfter: scoreAfterCalc(j)};

function dedupeSkills(list){ const seen = new Set(); return list.filter(s => { const k = s.text.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 18); }
async function tailorWithClaude(r, j, signal){

{"headline":string,"summary":string,"skills":[{"text":string,"status":"kept"|"keyword"|"added"}],"experience":[{"company":string,"role":string,"dates":string,"bullets":[{"text":string,"status":"unchanged"|"keyword"|"improved"|"stretch","original":string,"note":string}]}],"changes":[string]}

async function saveBlob(filename, blob){
  if (DL) { try { await DL.save({filename, data: blob}); toast('⬇ Saved ' + filename); return; } catch (e) { if (e && e.code === 'declined') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('⬇ Downloaded ' + filename);
}
async function pdfFromBlocks(blocks){
  await loadScript(LIB.jspdf);
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
  const W = 595, M = 48; let y = 56;
  const line = (txt, size = 10, bold = false, color = [40, 44, 52], gap = 4) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...color);
    for (const l of doc.splitTextToSize(String(txt), W - M * 2)) { if (y > 800) { doc.addPage(); y = 56; } doc.text(l, M, y); y += size + gap; }
  };
  for (const b of blocks) {
    if (b.type === 'name') line(b.text, 20, true, [29, 78, 216], 6);
    else if (b.type === 'sub') line(b.text, 9, false, [100, 100, 110], 3);
    else if (b.type === 'h') { y += 8; line(b.text.toUpperCase(), 9, true, [29, 78, 216], 2); doc.setDrawColor(200, 210, 230); doc.line(M, y - 4, W - M, y - 4); y += 4; }
    else if (b.type === 'role') { y += 2; line(b.text, 10, true); }
    else if (b.type === 'li') line('•  ' + b.text, 10);
    else if (b.type === 'gap') y += 10;
    else line(b.text, b.size || 10);
  }
  return doc.output('blob');
}

  r.experience.forEach(e => { blocks.push({type:'role', text:[e.role, e.company].filter(Boolean).join(' · ') + (e.dates ? `   (${e.dates})` : '')}); e.bullets.forEach(b => blocks.push({type:'li', text:b})); });

function drawerShell(title, body, foot, extra=''){

const btnP = (act, t, dis) => `<button data-act="${act}" ${dis?'disabled':''} class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold shadow-md disabled:opacity-40">${t}</button>`;
const btnS = (act, t) => `<button data-act="${act}" class="px-5 py-2.5 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold hover:bg-gray-50">${t}</button>`;
const stepper = n => `<div class="flex items-center justify-center gap-3 py-4 bg-white border-b border-gray-100">${['See your difference','Align your resume','Your new resume'].map((s,i)=>`<div class="flex items-center gap-2 ${i+1<=n?'text-gray-900':'text-gray-400'}"><span class="w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${i+1<n?'bg-green-500 text-white':i+1===n?'bg-blue-600 text-white':'bg-gray-200 text-gray-500'}">${i+1<n?'✓':i+1}</span><span class="text-sm font-semibold">${s}</span>${i<2?'<span class="w-10 h-px bg-gray-300 ml-2"></span>':''}</div>`).join('')}</div>`;

function resumeDoc(r, res){
  const st = S.t.style;
  const font = st.font === 'Georgia' ? 'Georgia, serif' : st.font === 'Arial' ? 'Arial, sans-serif' : 'Inter, sans-serif';
  const pad = st.tpl === 'Compact' ? 'p-6 text-[11px]' : 'p-8 text-[12px]';
  const contact = [r.location, r.email, r.linkedin].filter(Boolean).join(' · ');
  const headline = res ? res.headline : r.headline;
  const head = st.tpl === 'Modern'
    ? `<div class="-m-8 mb-4 p-6 text-white" style="background:${st.accent}"><h2 class="text-2xl font-bold">${esc(r.name)}</h2><p class="opacity-90">${esc(headline)}</p><p class="text-[10px] opacity-80 mt-1">${esc(contact)}</p></div>`
    : `<div class="text-center mb-3"><h2 class="text-2xl font-bold" style="color:${st.accent}">${esc(r.name)}</h2><p class="text-gray-700">${esc(headline)}</p><p class="text-[10px] text-gray-500 mt-0.5">${esc(contact)}</p></div>`;
  const H = x => `<h3 class="mt-3 mb-1 text-[11px] font-bold tracking-widest uppercase border-b pb-0.5" style="color:${st.accent};border-color:${st.accent}33">${x}</h3>`;
  const mk = (txt, status) => status === 'improved' || status === 'added' ? `<mark>${esc(txt)}</mark>` : status === 'keyword' ? `<mark class="kw">${esc(txt)}</mark>` : status === 'stretch' ? `<mark class="flag">${esc(txt)}</mark>` : esc(txt);
  const summary = res ? (res.summaryChanged ? mk(res.summary, 'improved') : esc(res.summary)) : esc(r.summary);
  const skills = res ? res.skills.map(s => mk(s.text, s.status)).join(' · ') : r.skills.map(esc).join(' · ');
  const exp = (res ? res.experience : r.experience.map(e => ({...e, bullets:e.bullets.map(b => ({text:b, status:'unchanged'}))}))).map(e => `<div class="mb-2"><div class="flex justify-between gap-2"><b class="text-gray-900">${esc([e.role, e.company].filter(Boolean).join(' · '))}</b><span class="text-gray-500 whitespace-nowrap">${esc(e.dates)}</span></div><ul class="list-disc pl-4 mt-0.5 space-y-0.5">${e.bullets.map(b => { const txt = res ? bulletText(b) : b.text; const stt = b.status === 'stretch' && S.t.claims[b.id] === 'original' ? 'unchanged' : b.status; return `<li>${mk(txt, stt)}</li>`; }).join('')}</ul></div>`).join('');
  return `<div class="doc ${S.t.hl ? '' : 'nohl'} bg-white shadow-lg border border-gray-200 rounded-md ${pad} text-gray-700 leading-relaxed" style="font-family:${font}">${head}${H('Summary')}<p>${summary}</p>${H('Core & Technical Skills')}<p>${skills}</p>${H('Experience')}${exp}${r.education?H('Education')+`<p>${esc(r.education)}</p>`:''}</div>`;
}
function drawerTailor(){
  const j = J(), t = S.t, r = R();
  if (t.step === 'diff') {

    const chip = (k, kind) => `<span class="px-2.5 py-1 rounded-lg text-xs font-medium ${kind==='have'?'bg-green-50 text-green-800':kind==='related'?'bg-teal-50 text-teal-800':'bg-gray-100 text-gray-500'}">${kind==='have'?'✓ ':kind==='related'?'≈ ':''}${esc(k)}</span>`;
    const k = j.keywords, total = k.have.length + k.related.length + k.missing.length, sb = scoreBefore(j);
    const expOk = j.dims.exp >= 70;
    return drawerShell('Tailor your resume', `${stepper(1)}<div class="max-w-4xl mx-auto p-6"><div class="bg-white rounded-2xl border border-gray-200 p-6">
      <h3 class="text-2xl font-bold text-gray-900">${sb >= 75 ? 'Your resume is a strong match. Let’s polish it.' : 'Your resume is a partial match. Let’s make it great.'}</h3>
      <p class="mt-2 inline-flex items-center gap-2 rounded-lg bg-amber-50 text-amber-800 text-sm px-3 py-1.5">${icon('info','w-4 h-4')}${k.missing.length ? 'Some keywords this job looks for are missing from your resume.' : 'Your resume covers the key terms; tailoring will sharpen the wording.'}</p>
      <div class="mt-4 flex items-center gap-4 rounded-xl bg-slate-50 p-4" data-change="Two scores, explained">${ring(sb, 64, 6, fitColor(sb), '#e5e7eb', 'text-gray-900')}<div class="text-sm"><p class="font-semibold text-gray-900">Resume match score: ${sb}%</p><p class="text-gray-500">How well your <b>resume</b> shows your fit to this job's screening (ATS). Your <b>job fit</b> is ${j.fit}%; tailoring helps your resume show it.</p></div></div>
      <div class="mt-4">
        ${row('Job', true, `<span class="flex items-center gap-2"><span class="w-7 h-7 rounded-lg ${j.tileBg} text-white text-xs font-bold flex items-center justify-center">${esc(j.tile)}</span><b class="text-gray-900">${esc(j.title)}</b> · ${esc(j.company)}</span>`)}
        ${row('Job title', true, `${esc(r.headline)} → ${esc(j.title)}`)}
        ${row('Years of experience', expOk, `${r.years}+ years (job asks ${esc(j.yearsRequired || 'n/a')})`)}
        ${row('Industry experience', j.dims.ind >= 65, j.tags.slice(0,4).map(x=>`<span class="px-2.5 py-1 rounded-lg ${r.industries.some(i => x.toLowerCase().includes(i.toLowerCase())) ? 'bg-green-50 text-green-800' : 'bg-gray-100 text-gray-600'} text-xs">${esc(x)}</span>`).join(''))}
        ${row(`Keywords (${k.have.length}/${total})`, !k.missing.length, k.have.map(x=>chip(x,'have')).join('') + k.related.map(x=>chip(x,'related')).join('') + k.missing.map(x=>chip(x,'missing')).join(''))}
      </div><p class="mt-3 text-xs text-gray-500">✓ on your resume · ≈ related experience we can highlight · grey = not on your resume yet</p></div></div>`, btnS('closedrawer','Cancel') + btnP('toalign','Next: align my resume →'));
  }
  if (t.step === 'align') {

function healthOf(r){
  const bullets = r.experience.flatMap(e => e.bullets);
  const withNum = bullets.filter(b => /\d/.test(b)).length;
  const impact = clamp(30 + 70 * withNum / Math.max(1, bullets.length), 25, 95);
  const best = S.jobs[0];
  const keywords = best ? clamp(scoreBefore(best), 30, 95) : 55;
  const summary = clamp(r.summary && r.summary.length > 120 ? (/\b(target|seeking|role)\b/i.test(r.summary) ? 80 : 58) : 40, 30, 90);
  const skills = clamp(40 + r.skills.length * 4, 40, 90);
  const ats = clamp(70 + (r.experience.length >= 2 ? 8 : 0) + (r.education ? 5 : 0), 60, 92);
  const dims = [['ATS readability', ats], ['Keywords for target role', keywords], ['Measurable impact', impact], ['Summary & positioning', summary], ['Skills coverage', skills]];
  const score = Math.round(dims.reduce((a, [, v]) => a + v, 0) / dims.length);
  const good = [r.years >= 3 && `${r.years}+ years of relevant experience`, r.skills.length >= 6 && `${r.skills.length} clear skills listed`, r.industries[0] !== 'General' && `Clear ${r.industries.join(', ')} background`, r.experience.length >= 2 && 'Consistent career history'].filter(Boolean).slice(0, 3);
  const work = [impact < 60 && `Only ${withNum} of ${bullets.length} bullets show a measurable result`, summary < 70 && 'Summary isn’t aimed at a specific role', keywords < 70 && best && `Missing keywords for ${best.title}: ${best.keywords.missing.slice(0, 2).join(', ')}`].filter(Boolean);
  const fix = [impact < 60 && 'Add a number (%, $, users, time) to your top 3 bullets', summary < 70 && 'Tailor your summary to one job', keywords < 70 && 'Tailor your resume to your best-fit job'].filter(Boolean);
  return {dims, score, good: good.length ? good : ['Readable, well-structured resume'], work: work.length ? work : ['Nothing major. Tailoring will still lift your match.'], fix: fix.length ? fix : ['Tailor to each job you apply for']};
}

  if (d.cl) { const [k, v] = d.cl.split(':'); S.cl[k] = v; if (S.cl.step === 'done' && !aiReady()) S.cl.text = letterLocal(S.tailored[J().id] ? tailoredAsResume(J()) : R(), J(), S.cl); render(); return; }
  if (d.focus) { S.cl.focus = S.cl.focus.includes(d.focus) ? S.cl.focus.filter(x => x !== d.focus) : [...S.cl.focus, d.focus]; render(); return; }
  if (d.filter) { const i = d.filter.indexOf(':'), k = d.filter.slice(0, i), v = d.filter.slice(i + 1); S.filters[k] = k === 'minFit' ? Number(v) : v; render(); return; }
  if (d.ask) { runAsk(d.ask); return; }
  switch (d.act) {
    case 'login': S.pending = null; go('signup'); break;
    case 'tools': S.toolsOpen = !S.toolsOpen; S.userOpen = false; render(); break;
    case 'usermenu': S.userOpen = !S.userOpen; S.toolsOpen = false; render(); break;
    case 'filters': S.filterOpen = !S.filterOpen; render(); break;
    case 'clearfilters': S.filters = {mode:'Any', level:'Any', minFit:0}; S.q = ''; S.filterOpen = false; render(); break;
    case 'dosearch': render(); toast(`${filteredJobs().length} jobs match`); break;
    case 'undohide': S.hidden.pop(); render(); break;
    case 'myresume': go('hub'); toast('Your base resume is on the left. Replace it any time.'); break;
    case 'tracker': S.tab = 'applied'; go('hub'); break;
    case 'plan': go('pricing'); break;
    case 'signout': { clearTimers(); const n = S.notesOpen; S = fresh(); S.notesOpen = n; render(); window.scrollTo(0, 0); toast('Signed out'); break; }
    case 'support': toast('Support: support@oneclicksmartresume.com · replies within 24 hours'); break;
    case 'pastetoggle': S.pasteOpen = !S.pasteOpen; render(); break;
    case 'analyzepaste': { const txt = (document.getElementById('pasteBox') || {}).value || S.pasteText; S.pasteText = txt; if (txt.trim().length < 80) { S.parseError = 'Paste a bit more of your resume (at least a few lines) so we can read it.'; render(); break; } S.pasteOpen = false; ingest(async () => txt, 'Pasted resume'); break; }
    case 'demo': S.fileName = 'Alex_Morgan_Resume.pdf (sample)'; S.resumeState = 'reading'; S.stage = 0; S.stages = ['Reading your file','Understanding your experience','Finding jobs that fit your resume','Scoring your job fit']; render(); { const tick = () => { S.stage++; if (S.stage >= 4) { loadDemo(); S.tipDismissed = false; render(); toast('✓ Sample resume loaded. 4 jobs matched.'); return; } render(); later(tick, 450); }; later(tick, 450); } break;
    case 'replace': S.resumeState = 'none'; S.pasteOpen = false; S.parseError = ''; if (S.view !== 'health') go('hub'); else render(); break;
    case 'stop': if (ctl) ctl.abort(); break;
    case 'dismisstip': S.tipDismissed = true; render(); break;
    case 'visible': S.visible = !S.visible; render(); break;
    case 'closedrawer': closeDrawer(); break;
    case 'toalign': setDrawerStep(() => S.t.step = 'align'); break;
    case 'todiff': setDrawerStep(() => { S.t.step = 'diff'; S.t.result = null; }); break;
    case 'generate': runGenerate(); break;
    case 'refine': toast('Got it. Use the Editor tab to adjust, or Start over with different sections.'); S.t.tab = 'edit'; render(); break;
    case 'addskill': { const inp = document.getElementById('addSkill'); const v = inp && inp.value.trim(); if (v) { S.t.result.skills.unshift({text:v, status:'added'}); inp.value = ''; render(); } break; }
    case 'downloadres': downloadResume(); break;
    case 'savetailor': {
      const j = J(), first = !S.tailored[j.id];
      S.tailored[j.id] = {result: S.t.result, claims: S.t.claims, t: S.t}; if (first) S.left = Math.max(0, S.left - 1);
      toast('✓ Tailored resume saved to your application kit');
      if (S.letters[j.id]) S.drawer = 'apply'; else { S.cl = {...freshCL(), focus: j.keywords.have.slice(0, 2)}; S.drawer = 'cover'; }
      S.drawerAnim = true; render(); break;
    }
    case 'genletter': runLetter(); break;
    case 'copyletter': { const t = (document.getElementById('letterBody') || {}).innerText || S.cl.text; try { navigator.clipboard.writeText(t).then(() => toast('📋 Copied'), () => toast('Select the text and copy it')); } catch (err) { toast('Select the text and copy it'); } break; }
    case 'downloadletter': downloadLetter(); break;
    case 'savecover': { const j = J(); S.cl.text = (document.getElementById('letterBody') || {}).innerText || S.cl.text; S.letters[j.id] = {tone:S.cl.tone, length:S.cl.length, text:S.cl.text, focus:S.cl.focus}; toast('✓ Cover letter saved to your application kit'); S.drawer = 'apply'; S.drawerAnim = true; render(); break; }
    case 'openapp': toast(`In the live product this opens ${J().company}’s application page.`); break;
    case 'markapplied': { const j = J(); if (!S.applied.includes(j.id)) { S.applied.push(j.id); S.appStatus[j.id] = 'Applied'; } S.drawer = null; render(); toast('🎉 Applied! Tracked in Talent Hub → Applied'); if (S.applied.length === 1) later(() => { S.modal = 'challenge'; render(); }, 900); break; }
    case 'prep': S.jobId = el.dataset.job; go('interview'); break;
    case 'challenge': S.modal = 'challenge'; render(); break;
    case 'joinchallenge': S.modal = null; render(); toast('🏆 You’re in! Progress shows in your checklist.'); break;
    case 'closemodal': S.modal = null; render(); break;
    case 'healthtailor': S.jobId = S.jobs[0].id; S.view = 'job'; render(); window.scrollTo(0, 0); openDrawer('tailor'); break;
    case 'plango': go(S.signedIn ? 'hub' : 'signup'); break;
    case 'startinterview': S.practised = true; toast('🎙 Starting your mock interview for ' + ((document.getElementById('ivCo') || {}).value || 'this job')); render(); break;
    case 'trialgate': S.pending = null; go('signup'); break;
    case 'asksend': { const v = (document.getElementById('askInput') || {}).value || ''; S.askDraft = ''; runAsk(v); break; }
    case 'sso': toast('Connecting…'); later(afterSignIn, 600); break;
    case 'sendcode': { const em = document.getElementById('aEmail'), nm = document.getElementById('aName'); S.auth.email = (em && em.value.trim()) || 'you@example.com'; S.auth.name = nm ? nm.value : ''; S.auth.step = 'code'; S.auth.status = 'idle'; render(); toast('✉ Code sent. You can switch to your inbox; this page will wait.'); break; }
    case 'fillcode': S.auth.code = '482913'; render(); break;
    case 'verify': S.auth.code = S.auth.code || '482913'; S.auth.status = 'verifying'; render(); later(afterSignIn, 900); break;
    case 'simslow': S.auth.code = S.auth.code || '482913'; S.auth.status = 'verifying'; render(); later(() => { S.auth.status = 'slow'; render(); }, 1500); break;
    case 'resend': S.auth.code = ''; S.auth.status = 'idle'; render(); toast('✉ New code sent'); break;
    case 'authback': S.auth.step = 'form'; S.auth.status = 'idle'; render(); break;
    case 'closenotes': S.notesOpen = false; renderNotes(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset || {};
  if (el.id === 'resumeFile' && el.files && el.files[0]) { const f = el.files[0]; if (f.size > 10 * 1024 * 1024) { S.parseError = 'That file is over 10 MB. Try a smaller PDF or DOCX.'; render(); return; } ingest(() => fileToText(f), f.name); el.value = ''; return; }
  if (d.sec) { S.t.sections[d.sec] = el.checked; render(); }
  if (d.kw) { S.t.add[d.kw] = el.checked; render(); }
  if (d.expmode) { S.t.expMode = d.expmode; render(); }
  if (d.status) { S.appStatus[d.status] = el.value; render(); toast(`Status updated: ${el.value}`); }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset || {};
  if (d.p) S.profile[d.p] = el.value;
  if (d.q) { S.q = el.value; render(); }
  if (d.askinput) S.askDraft = el.value;
  if (el.id === 'pasteBox') S.pasteText = el.value;
  if (el.id === 'aCode') S.auth.code = el.value.replace(/\D/g, '').slice(0, 6);
  if (d.edit === 'summary' && S.t.result) { S.t.result.summary = el.innerText; S.t.result.summaryChanged = true; refreshPreview(); }
  if (d.bullet && S.t.result) { const [a, b] = d.bullet.split(':').map(Number); const bl = S.t.result.experience[a].bullets[b]; bl.text = el.innerText; if (bl.status === 'stretch') S.t.claims[bl.id] = 'new'; if (bl.status === 'unchanged' || bl.status === 'keyword') bl.status = 'improved'; refreshPreview(); }
  if (d.letter) S.cl.text = el.innerText;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'askInput') { e.preventDefault(); const v = e.target.value; S.askDraft = ''; runAsk(v); }
  if (e.key === 'Escape') { if (S.modal) { S.modal = null; render(); } else if (S.drawer) { closeDrawer(); } else if (S.toolsOpen || S.userOpen || S.filterOpen) { S.toolsOpen = S.userOpen = S.filterOpen = false; render(); } }
});
function refreshPreview(){ const box = document.getElementById('previewBox'); if (box) box.innerHTML = resumeDoc(R(), S.t.result); }
['dragover','drop'].forEach(ev => document.addEventListener(ev, e => {
  const zone = e.target.closest && e.target.closest('label[for="resumeFile"]'); if (!zone) return; e.preventDefault();
  if (ev === 'drop' && e.dataTransfer.files[0]) { const f = e.dataTransfer.files[0]; ingest(() => fileToText(f), f.name); }
}));
document.getElementById('pcChanges').addEventListener('click', e => { document.body.classList.toggle('show-changes'); e.currentTarget.textContent = document.body.classList.contains('show-changes') ? 'Hide highlights' : 'Highlight changes'; });
document.getElementById('pcNotes').addEventListener('click', () => { S.notesOpen = !S.notesOpen; renderNotes(); });
document.getElementById('pcRestart').addEventListener('click', () => { clearTimers(); const n = S.notesOpen; S = fresh(); S.notesOpen = n; history.replaceState(null, '', location.pathname + location.search); render(); window.scrollTo(0, 0); });

/* Always show the desktop website; scale it to fit narrow windows */
const DESIGN_WIDTH = 1360;
function fitToWindow(){ document.documentElement.style.zoom = Math.min(1, window.innerWidth / DESIGN_WIDTH); }
window.addEventListener('resize', fitToWindow);
fitToWindow();

/* Jump links for presenting: #hub #job #tailor #align #result #cover #apply #applied #health */
function applyHash(){
  const h = (location.hash || '').slice(1); if (!h) return;
  S = fresh(); loadDemo(); S.signedIn = true; S.jobId = 'j1'; S.tipDismissed = true; S.fileName = 'Alex_Morgan_Resume.pdf (sample)';
  const withTailor = () => { S.t = freshT(); S.t.add = {SQL:true}; S.t.result = tailorLocal(R(), J()); S.t.claims = {}; S.t.result.experience.forEach(e => e.bullets.forEach(b => { if (b.status === 'stretch') S.t.claims[b.id] = 'original'; })); S.t.step = 'result'; };
  if (h === 'hub') S.view = 'hub';
  else if (h === 'health') S.view = 'health';
  else if (h === 'job') S.view = 'job';
  else if (['tailor','align','result'].includes(h)) { S.view = 'job'; S.drawer = 'tailor'; S.t = freshT(); S.t.step = h === 'tailor' ? 'diff' : h; if (h === 'result') withTailor(); }
  else if (h === 'cover') { S.view = 'job'; withTailor(); S.tailored.j1 = {result:S.t.result, claims:S.t.claims, t:S.t}; S.left = 9; S.drawer = 'cover'; S.cl = {...freshCL(), focus:J().keywords.have.slice(0, 2), step:'done'}; S.cl.text = letterLocal(tailoredAsResume(J()), J(), S.cl); }
  else if (h === 'apply' || h === 'applied') { S.view = h === 'apply' ? 'job' : 'hub'; withTailor(); S.tailored.j1 = {result:S.t.result, claims:S.t.claims, t:S.t}; S.left = 9; S.letters.j1 = {tone:'Warm', length:'Standard', text:'', focus:[]}; if (h === 'apply') S.drawer = 'apply'; else { S.applied = ['j1']; S.appStatus = {j1:'Interviewing'}; S.tab = 'applied'; } }
}
window.addEventListener('hashchange', () => { applyHash(); render(); window.scrollTo(0, 0); });
applyHash();
render();
</script>
